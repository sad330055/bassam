<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>كواليس المشروع: تقرير التأمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f2f2f2;--silver:#c6c6c6;--muted:#8d8d8d;--line:rgba(255,255,255,.22);--glass:rgba(0,0,0,.6);
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:#000}
body{min-height:100vh;background:#000;color:var(--ink);font:400 1rem/1.9 var(--font);overflow-x:hidden}
.wrap{width:min(1120px,100% - 2rem);margin-inline:auto}

/* Moving star field: radial-gradient dots tiled and drifted with keyframes */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#000}
.sky i{position:absolute;inset:0;animation:drift linear infinite}
.sky i:nth-child(1){background-image:radial-gradient(1px 1px at 25px 40px,#fff,transparent),radial-gradient(1px 1px at 120px 150px,#fff,transparent),radial-gradient(1.5px 1.5px at 210px 90px,#ddd,transparent),radial-gradient(1px 1px at 60px 220px,#fff,transparent);background-size:250px 250px;--t:250px;animation-duration:90s}
.sky i:nth-child(2){background-image:radial-gradient(1px 1px at 40px 70px,#ccc,transparent),radial-gradient(1px 1px at 200px 250px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 120px,#fff,transparent);background-size:360px 360px;--t:360px;animation-duration:150s;opacity:.8}
.sky i:nth-child(3){background-image:radial-gradient(2px 2px at 90px 110px,#fff,transparent),radial-gradient(2px 2px at 380px 330px,#eee,transparent),radial-gradient(2px 2px at 250px 450px,#fff,transparent);background-size:520px 520px;--t:520px;animation:drift 220s linear infinite,twinkle 6s ease-in-out infinite alternate}
@keyframes drift{to{background-position:0 calc(var(--t) * -1)}}
@keyframes twinkle{50%{opacity:.35}}

.hero{padding:clamp(3.5rem,9vw,7rem) 0 3rem;text-align:center}
h1{font-size:clamp(2.2rem,7vw,4.4rem);line-height:1.3;font-weight:700;margin-bottom:1rem;
  background:linear-gradient(180deg,#fff 25%,#8f8f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--silver);max-width:40rem;margin:0 auto 3.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:1.5rem;text-align:start}

/* 3D tilt cards (glass lives on ::before so backdrop-filter doesn't flatten preserve-3d) */
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:1.4rem;min-height:190px;padding:1.7rem;
  font:inherit;color:inherit;text-align:start;cursor:pointer;background:none;border:0;border-radius:18px;
  transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .3s,box-shadow .3s}
.card>*{position:relative;transform:translateZ(36px)}
.card:hover,.card:focus-visible{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(26px)}
.card:hover::before,.card:focus-visible::before{border-color:rgba(255,255,255,.65);box-shadow:0 28px 60px -24px rgba(255,255,255,.22)}
.card:focus-visible{outline:2px solid #fff;outline-offset:5px}
.card h2{font-size:1.25rem;line-height:1.65;font-weight:700}
.card small{color:var(--muted);font-size:.9rem;transform:translateZ(60px)}
.cta{display:inline-block;margin-top:3.2rem;padding:.7rem 1.8rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;transition:background .3s,color .3s}
.cta:hover,.cta:focus-visible{background:#fff;color:#000}

/* Report pages */
.pages{padding:3rem 0 7rem}
.pages h2{text-align:center;font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:700}
.pages>p{text-align:center;color:var(--muted);margin:.4rem 0 3rem}
.sheet{width:min(100%,720px);margin:0 auto 3.5rem}
.page{position:relative;overflow:hidden;background:#fff;border:1px solid rgba(255,255,255,.3);border-radius:14px;box-shadow:0 30px 80px -34px rgba(255,255,255,.25)}
.page img{display:block;width:100%;height:auto}
.sheet figcaption{margin-top:.8rem;text-align:center;color:var(--muted);font-size:.9rem}
.js .reveal{opacity:0;transform:translateY(64px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.js .reveal.in{opacity:1;transform:none}

/* QR badge (uploaded QR image): pinned to the physical bottom-left corner of the last page */
.qr-badge{position:absolute;left:2.2%;bottom:2.2%;width:clamp(84px,17%,132px);background:#000;border:2px solid #000;direction:ltr;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.qr-badge b{display:block;padding:.3em 0;color:#fff;text-align:center;font:700 clamp(.6rem,1.9vw,.8rem)/1.2 Arial,sans-serif;letter-spacing:.2em}
.qr-badge img{display:block;width:100%;height:auto;padding:5%;background:#fff}

/* Full-screen modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:1.2rem;background:rgba(0,0,0,.95);
  opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.modal.open{opacity:1;visibility:visible}
.m-card{position:relative;width:min(680px,100%);padding:clamp(1.5rem,4vw,2.6rem);transform-style:preserve-3d;
  transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(.92);transition:transform .15s ease-out}
.modal.open .m-card{transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1)}
.m-card::before{content:"";position:absolute;inset:0;border-radius:20px;background:rgba(10,10,10,.8);border:1px solid rgba(255,255,255,.4);box-shadow:0 40px 90px -30px rgba(255,255,255,.2)}
.m-card>*{position:relative}
.m-card h3{font-size:clamp(1.3rem,3.6vw,1.8rem);line-height:1.6;margin-bottom:1.2rem;transform:translateZ(50px)}
.m-body{max-height:56vh;overflow:auto;transform:translateZ(28px)}
.m-body p+p{margin-top:1rem}
.m-body strong{color:#fff}
.m-body{color:var(--silver)}
.m-close{position:absolute;top:1.2rem;left:1.2rem;z-index:2;width:46px;height:46px;font:inherit;font-size:1.6rem;line-height:1;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:50%;cursor:pointer}
.m-close:hover,.m-close:focus-visible{background:#fff;color:#000;outline:none}

@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

<header class="hero wrap">
  <h1>كواليس المشروع: تقرير التأمل</h1>
  <p class="lead">أسئلة تكشف ما وراء النشاط: ماذا تعلّمت، وأين تعثّرت، وكيف اختلفت النتيجة عن توقعي. اضغط على أي بطاقة لقراءة الإجابة كاملة.</p>
  <div class="grid" id="faq"></div>
  <a class="cta" href="#pages">تصفّح صفحات التقرير</a>
</header>

<main class="pages wrap" id="pages">

      ['الخطأ', 'تسجيل الأعداد المطلقة (التكرارات) فقط في مسودة الجدول الأولى دون ذكر النسب المئوية أو حجم العينة الكلي.'],
      ['طريقة الحل', 'أعدت صياغة الجدول بدقة علمية وأضفت عمود النسبة المئوية مقترناً بحجم العينة الإجمالي (N=40) لإبراز الأثر الإحصائي الحقيقي وتجنب تضليل القارئ.']]},
    {q: 'ما الذي توقعته من نشاطك قبل البدء؟', a: [
      'توقعت تشتت أعداد المشاركين وعدم وجود نمط منتظم للتزايد، كما توقعت تساوياً تقريباً بين نسب تفضيل الأنشطة المدرسية المختلفة.']},
    {q: 'هل كانت النتيجة النهائية مطابقة لتوقعك؟', a: [
      'كانت النتيجة مطابقة جزئياً في تفضيل النشاط العلمي والتقني كنسبة أعلى (40%)، وخالفت توقعي في النمط: حيث أثبتت الأرقام وجود زيادة خطية منتظمة تحكمها قاعدة رياضية صريحة وقابلة للتنبؤ بدقة.']},
    {q: 'ما الاستنتاج الذي خرج به النشاط؟', a: [
      ['أولاً', 'أثبتت الأرقام والنسب المئوية أن النشاط العلمي والتقني هو الخيار الأكثر تفضيلاً بنسبة 40% من المجتمع المدرسي.'],
      ['ثانياً', 'النمط العددي للمشاركة يتزايد بانتظام خطي (+5 طلاب أسبوعياً)، والقاعدة الرياضية (5n + 10) دقيقة وصامدة للتنبؤ المستقبلي.'],
      ['ثالثاً', 'الالتزام بالأمانة الإحصائية وحوكمة البيانات يضمن صدق النتائج وتوجيه القرارات الإدارية المدرسية بشكل صحيح.']]}
  ];

  // Sets --rx / --ry from a pointer position (fx, fy are 0..1 within the reference box)
  const tilt = (el, fx, fy, max) => {
    el.style.setProperty('--ry', ((fx - .5) * 2 * max).toFixed(2) + 'deg');
    el.style.setProperty('--rx', (-(fy - .5) * 2 * max).toFixed(2) + 'deg');
  };
  const untilt = el => { el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); };

  // ---- FAQ cards
  const modal = $('modal'), mCard = $('m-card'), closeBtn = $('m-close');
  let opener = null;

  const openModal = (item, btn) => {
    opener = btn;
    $('m-title').textContent = item.q;
    const body = $('m-body');
    body.replaceChildren(...item.a.map(x => {
      const p = document.createElement('p');
      if (Array.isArray(x)) {
        const s = document.createElement('strong');
        s.textContent = x[0] + ': ';
        p.append(s, x[1]);
      } else p.textContent = x;
      return p;
    }));
    body.scrollTop = 0;
    untilt(mCard);
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    closeBtn.focus({preventScroll: true});
  };
  const closeModal = () => {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (opener) opener.focus({preventScroll: true});
  };

  FAQ.forEach(item => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.innerHTML = '<h2></h2><small>اقرأ الإجابة</small>';
    card.firstChild.textContent = item.q;
    card.addEventListener('click', () => openModal(item, card));
    if (!calm) {
      card.addEventListener('pointermove', e => {
        if (e.pointerType === 'touch') return;
        const r = card.getBoundingClientRect();
        tilt(card, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, 14);
      });
      card.addEventListener('pointerleave', () => untilt(card));
    }
    $('faq').appendChild(card);
  });

  // ---- Modal: close controls + cursor-tracked 3D tilt over the whole screen
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); }
  });
  if (!calm) {
    let raf = 0;
    modal.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch' || raf) return;
      raf = requestAnimationFrame(() => { raf = 0; tilt(mCard, e.clientX / innerWidth, e.clientY / innerHeight, 12); });
    });
    modal.addEventListener('pointerleave', () => untilt(mCard));
  }

  // ---- Scroll reveal
  const items = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) items.forEach(el => el.classList.add('in'));
  else {
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    }), {threshold: .12, rootMargin: '0px 0px -6% 0px'});
    items.forEach(el => io.observe(el));
  }

})();
</script>
</body>
</html>
